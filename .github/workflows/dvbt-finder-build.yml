name: Build DVB-T Asystent APK

on:
  push:
    branches:
      - finder-apk-1.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Przygotuj dane i mapę dla APK
        shell: bash
        run: |
          mkdir -p android-finder/app/src/main/assets
          { printf 'window.TRANSMITTER_DATA='; cat data/transmitters.json; printf ';\n'; } > android-finder/app/src/main/assets/transmitters.js
          curl -fsSL https://unpkg.com/leaflet@1.9.4/dist/leaflet.js -o android-finder/app/src/main/assets/leaflet.js
          curl -fsSL https://unpkg.com/leaflet@1.9.4/dist/leaflet.css -o android-finder/app/src/main/assets/leaflet.css
          test -s android-finder/app/src/main/assets/transmitters.js
          test -s android-finder/app/src/main/assets/leaflet.js
          test -s android-finder/app/src/main/assets/leaflet.css

      - name: Zainstaluj Android SDK
        shell: bash
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip" -o /tmp/android-cmdline.zip
          unzip -q /tmp/android-cmdline.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Zbuduj APK
        working-directory: android-finder
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Przygotuj pliki
        shell: bash
        run: |
          mkdir -p android-finder/dist
          cp android-finder/app/build/outputs/apk/debug/app-debug.apk android-finder/dist/DVB-T-Asystent-PL-1.1.apk
          sha256sum android-finder/dist/DVB-T-Asystent-PL-1.1.apk > android-finder/dist/SHA256SUMS.txt

      - name: Artefakt APK
        uses: actions/upload-artifact@v4
        with:
          name: DVB-T-Asystent-PL-1.1
          path: |
            android-finder/dist/DVB-T-Asystent-PL-1.1.apk
            android-finder/dist/SHA256SUMS.txt
          retention-days: 30
