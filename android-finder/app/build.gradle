plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.dvbt.asystent'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.dvbt.asystent'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
