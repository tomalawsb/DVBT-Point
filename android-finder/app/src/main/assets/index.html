<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1016">
<title>DVB-T Asystent PL</title>
<link rel="stylesheet" href="leaflet.css">
<style>
:root{--bg:#0a1016;--panel:#121a22;--panel2:#18232d;--line:#293846;--text:#f2f6f9;--muted:#91a2b1;--accent:#00c2ff;--good:#45d483;--warn:#ffc857}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}button,input{font:inherit}button{cursor:pointer}
#app{height:100%;display:flex;flex-direction:column}.header{height:56px;display:flex;align-items:center;gap:9px;padding:0 12px;background:#080d12;border-bottom:1px solid var(--line);z-index:1500}.logo{font-size:22px}.brand{font-size:17px;font-weight:900;flex:1}.ver{font-size:11px;color:var(--muted)}
.mapWrap{position:relative;flex:1;min-height:260px}.map{height:100%;width:100%;background:#111820}.searchbar{position:absolute;z-index:1000;left:10px;right:10px;top:10px;display:flex;gap:7px}.search{flex:1;background:rgba(18,26,34,.97);border:1px solid #334756;color:#fff;border-radius:13px;padding:12px 13px;outline:none;box-shadow:0 4px 18px #0007;font-size:14px}.round{width:46px;border:0;border-radius:13px;background:var(--accent);color:#00151d;font-size:22px;font-weight:900;box-shadow:0 4px 18px #0007}
.mapHint{position:absolute;z-index:900;left:10px;bottom:10px;background:rgba(8,13,18,.86);border:1px solid #243442;border-radius:10px;padding:7px 9px;color:#c7d2db;font-size:11px;max-width:75%}
.sheet{height:43%;min-height:300px;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -8px 26px #0008;display:flex;flex-direction:column;z-index:1400}.handle{width:44px;height:4px;background:#465664;border-radius:999px;margin:8px auto 4px}.tabs{display:flex;gap:6px;padding:4px 8px 8px}.tab{flex:1;border:1px solid #2b3b49;background:var(--panel2);color:#c6d1da;border-radius:10px;padding:9px 4px;font-size:11px;font-weight:900}.tab.active{background:#103a49;color:#a9eaff;border-color:#17607a}.content{flex:1;overflow:auto;padding:0 9px 14px}.card{background:#0f161d;border:1px solid #263643;border-radius:13px;padding:11px;margin-bottom:8px}.tx{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.tx.selected{border-color:#159bc3;box-shadow:inset 0 0 0 1px #159bc3}.name{font-size:14px;font-weight:900;line-height:1.25}.meta{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}.badge{border-radius:999px;padding:5px 8px;background:#143648;color:#a9eaff;font-size:10px;font-weight:900;white-space:nowrap}
.hero{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:center}.compass{width:112px;height:112px;border:2px solid #365268;border-radius:50%;position:relative;background:radial-gradient(circle,#15222c 0,#0c141b 70%)}.north{position:absolute;top:3px;left:50%;transform:translateX(-50%);font-weight:900;color:#ff7282}.needle{position:absolute;width:5px;height:84px;left:52px;top:14px;transform-origin:50% 42px;transition:transform .12s linear}.needle:before{content:"";position:absolute;left:-7px;top:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:43px solid var(--accent)}.needle:after{content:"";position:absolute;left:-5px;top:43px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:32px solid #71808d}.dot{position:absolute;left:48px;top:48px;width:12px;height:12px;border-radius:50%;background:white}.az{font-size:30px;font-weight:950}.dir{font-size:17px;font-weight:900;color:#a9eaff;margin-top:2px}.small{font-size:11px;color:var(--muted);line-height:1.45}.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.pill{background:#182631;border-radius:9px;padding:7px 9px;font-size:11px}.btn{border:0;border-radius:10px;padding:9px 11px;background:#0d87aa;color:#fff;font-weight:900;font-size:11px}.btn.alt{background:#263642;color:#e5edf3}.mux{border-left:4px solid var(--accent);padding-left:9px}.muxTitle{font-weight:900;font-size:13px}.empty{text-align:center;color:var(--muted);padding:22px 10px}.leaflet-control-attribution{font-size:9px}.leaflet-control-zoom{margin-bottom:34px!important}.userArrow{font-size:29px;color:#15b8ff;font-weight:900;text-shadow:0 1px 4px #00151d;line-height:30px;transform-origin:center}.txMarker{width:18px;height:18px;background:var(--warn);border:3px solid #543a0d;transform:rotate(45deg);box-shadow:0 1px 6px #0009}.targetMarker{width:23px;height:23px;background:#ff7b57;border:4px solid #5a2012;transform:rotate(45deg);box-shadow:0 1px 8px #000b}
@media(min-width:720px){.sheet{height:38%}.searchbar{max-width:700px;margin:auto}.content{max-width:900px;width:100%;margin:auto}}
</style>
</head>
<body>
<div id="app">
  <div class="header"><div class="logo">📡</div><div class="brand">DVB-T Asystent PL</div><div class="ver">v1.1</div></div>
  <div class="mapWrap">
    <div id="map" class="map"></div>
    <div class="searchbar"><input id="search" class="search" placeholder="Miejscowość, nadajnik, MUX, kanał lub MHz…"><button class="round" onclick="centerMe()">◎</button></div>
    <div id="mapHint" class="mapHint">GPS: oczekiwanie</div>
  </div>
  <section class="sheet">
    <div class="handle"></div>
    <div class="tabs"><button class="tab active" data-tab="near">NAJBLIŻSZE</button><button class="tab" data-tab="aim">CELOWANIE</button><button class="tab" data-tab="details">PARAMETRY</button></div>
    <div id="content" class="content"></div>
  </section>
</div>
<script src="leaflet.js"></script>
<script src="transmitters.js"></script>
<script>
const TXS=(window.TRANSMITTER_DATA&&window.TRANSMITTER_DATA.transmitters)||[];
const $=id=>document.getElementById(id); const rad=d=>d*Math.PI/180; const deg=r=>r*180/Math.PI;
let map,user={lat:null,lon:null,acc:null,heading:0},selected=null,activeTab='near',userMarker,targetMarker,routeLine,allMarkers=[];
function norm(s){return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9.]+/g,' ').trim()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dist(a,b,c,d){const R=6371,dp=rad(c-a),dl=rad(d-b);const x=Math.sin(dp/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function bearing(a,b,c,d){const y=Math.sin(rad(d-b))*Math.cos(rad(c));const x=Math.cos(rad(a))*Math.sin(rad(c))-Math.sin(rad(a))*Math.cos(rad(c))*Math.cos(rad(d-b));return (deg(Math.atan2(y,x))+360)%360}
function diffDeg(target,heading){return ((target-heading+540)%360)-180}
function searchable(t){let s=[t.name,t.short_name,t.location,t.site];(t.muxes||[]).forEach(m=>s.push(m.name,m.channel,m.channel_no,m.frequency_mhz,m.erp_kw,m.polarization,m.operator,m.band));return norm(s.join(' '))}
function filtered(){const q=norm($('search').value);let arr=TXS.filter(t=>!q||searchable(t).includes(q)).map(t=>({...t,_d:user.lat==null?99999:dist(user.lat,user.lon,t.lat,t.lon)}));arr.sort((a,b)=>a._d-b._d||(a.name||'').localeCompare(b.name||'','pl'));return arr}
function initMap(){map=L.map('map',{zoomControl:false}).setView([52.05,19.2],6);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);renderAll();setTimeout(()=>map.invalidateSize(),200)}
function userIcon(){return L.divIcon({className:'',html:`<div class="userArrow" style="transform:rotate(${user.heading}deg)">▲</div>`,iconSize:[30,30],iconAnchor:[15,15]})}
function txIcon(target=false){return L.divIcon({className:'',html:`<div class="${target?'targetMarker':'txMarker'}"></div>`,iconSize:[target?23:18,target?23:18],iconAnchor:[target?11:9,target?11:9]})}
function setUserMarker(){if(user.lat==null)return;if(userMarker)map.removeLayer(userMarker);userMarker=L.marker([user.lat,user.lon],{icon:userIcon(),zIndexOffset:1200}).addTo(map).bindTooltip('Twoja pozycja')}
function renderMapMarkers(){allMarkers.forEach(m=>map.removeLayer(m));allMarkers=[];const arr=filtered().slice(0,user.lat==null?70:55);for(const t of arr){if(selected&&t.id===selected.id)continue;const m=L.marker([t.lat,t.lon],{icon:txIcon(false)}).addTo(map);m.on('click',()=>selectTx(t.id,true));m.bindTooltip(t.name||t.short_name||'Nadajnik');allMarkers.push(m)}}
function updateRoute(){if(routeLine){map.removeLayer(routeLine);routeLine=null}if(targetMarker){map.removeLayer(targetMarker);targetMarker=null}if(!selected)return;targetMarker=L.marker([selected.lat,selected.lon],{icon:txIcon(true),zIndexOffset:1000}).addTo(map).bindTooltip(selected.name||'Wybrany nadajnik');if(user.lat!=null)routeLine=L.polyline([[user.lat,user.lon],[selected.lat,selected.lon]],{color:'#00c2ff',weight:4,opacity:.85,dashArray:'8 7'}).addTo(map)}
function renderList(){if(activeTab!=='near')return;const arr=filtered().slice(0,100);if(!arr.length){$('content').innerHTML='<div class="empty">Brak wyników. Spróbuj np. „Rzeszow”, „MUX 3”, „K29” albo „538”.</div>';return} $('content').innerHTML=arr.map(t=>`<div class="card tx ${selected&&selected.id===t.id?'selected':''}" onclick="selectTx('${esc(t.id)}',true)"><div><div class="name">${esc(t.name||t.short_name)}</div><div class="meta">${esc((t.muxes||[]).map(m=>m.name).filter(Boolean).join(' • ')||'DVB-T/T2')} · ${user.lat!=null?t._d.toFixed(1)+' km':'GPS potrzebny do odległości'}</div></div><div class="badge">${(t.muxes||[]).length} emisji</div></div>`).join('')}
function selectTx(id,fit){selected=TXS.find(t=>t.id===id)||null;if(!selected)return;updateRoute();renderMapMarkers();renderAll();if(fit){if(user.lat!=null)map.fitBounds([[user.lat,user.lon],[selected.lat,selected.lon]],{padding:[45,45],maxZoom:13});else map.setView([selected.lat,selected.lon],12)}}
function renderAim(){if(activeTab!=='aim')return;if(!selected){$('content').innerHTML='<div class="empty">Wybierz nadajnik z listy.</div>';return}if(user.lat==null){$('content').innerHTML='<div class="empty">Do celowania potrzebna jest lokalizacja.<br><br><button class="btn" onclick="requestGps()">WŁĄCZ GPS</button></div>';return}const b=bearing(user.lat,user.lon,selected.lat,selected.lon),d=dist(user.lat,user.lon,selected.lat,selected.lon),df=diffDeg(b,user.heading);const dir=Math.abs(df)<5?'TRZYMAJ TEN KIERUNEK':Math.abs(df)<15?(df>0?'lekko w prawo':'lekko w lewo'):(df>0?'OBRÓĆ W PRAWO':'OBRÓĆ W LEWO');$('content').innerHTML=`<div class="card hero"><div class="compass"><div class="north">N</div><div class="needle" style="transform:rotate(${df}deg)"></div><div class="dot"></div></div><div><div class="small">Cel</div><div class="name">${esc(selected.name)}</div><div class="az">${Math.round(b)}°</div><div class="dir">${dir}</div><div class="small">telefon ${Math.round(user.heading)}° · różnica ${Math.round(df)}°</div></div></div><div class="card"><div class="row"><div class="pill">📏 ${d.toFixed(1)} km</div><div class="pill">📍 GPS ±${user.acc?Math.round(user.acc):'?'} m</div></div><div class="small" style="margin-top:9px">Trzymaj telefon płasko. Niebieska strzałka na mapie pokazuje, w którą stronę jest obrócony telefon. Linia prowadzi do wybranego nadajnika.</div><div class="row"><button class="btn" onclick="fitRoute()">POKAŻ CAŁĄ TRASĘ</button><button class="btn alt" onclick="centerMe()">MOJA POZYCJA</button></div></div>`}
function renderDetails(){if(activeTab!=='details')return;if(!selected){$('content').innerHTML='<div class="empty">Wybierz nadajnik z listy.</div>';return}let extra='';if(user.lat!=null){const d=dist(user.lat,user.lon,selected.lat,selected.lon),b=bearing(user.lat,user.lon,selected.lat,selected.lon);extra=`<div class="row"><div class="pill">${d.toFixed(1)} km</div><div class="pill">azymut ${Math.round(b)}°</div></div>`}let html=`<div class="card"><div class="name">${esc(selected.name)}</div><div class="meta">${esc(selected.location||'')} ${esc(selected.site||'')}</div>${extra}</div>`;(selected.muxes||[]).forEach(m=>{html+=`<div class="card mux"><div class="muxTitle">${esc(m.name||'MUX')} · ${esc(m.channel||('K'+(m.channel_no||'?')))}</div><div class="small">${m.frequency_mhz!=null?m.frequency_mhz+' MHz · ':''}${m.erp_kw!=null?'ERP '+m.erp_kw+' kW · ':''}${m.polarization?'pol. '+esc(m.polarization)+' · ':''}${esc(m.operator||'')}</div></div>`});$('content').innerHTML=html}
function renderAll(){renderList();renderAim();renderDetails();updateRoute();renderMapMarkers()}
function requestGps(){if(window.Android&&Android.requestLocation)Android.requestLocation()}
function centerMe(){if(user.lat!=null)map.setView([user.lat,user.lon],14);else requestGps()}
function fitRoute(){if(selected&&user.lat!=null)map.fitBounds([[user.lat,user.lon],[selected.lat,selected.lon]],{padding:[45,45],maxZoom:13})}
window.onNativeLocation=(lat,lon,acc)=>{const first=user.lat==null;user.lat=Number(lat);user.lon=Number(lon);user.acc=Number(acc);$('mapHint').textContent=`GPS: ${user.lat.toFixed(5)}, ${user.lon.toFixed(5)} · ±${acc>0?Math.round(acc):'?'} m`;setUserMarker();renderAll();if(first){const n=filtered()[0];if(n)selectTx(n.id,false);map.setView([user.lat,user.lon],11)}};
window.onNativeLocationError=msg=>{$('mapHint').textContent='GPS: '+msg};
window.onCompassHeading=h=>{user.heading=(Number(h)+360)%360;setUserMarker();if(activeTab==='aim')renderAim()};
window.onCompassUnavailable=()=>{$('mapHint').textContent+=' · brak kompasu'};
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeTab=b.dataset.tab;renderAll()}));
$('search').addEventListener('input',()=>{activeTab='near';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='near'));renderAll()});
initMap();requestGps();if(window.Android&&Android.startCompass)Android.startCompass();
</script>
</body>
</html>
